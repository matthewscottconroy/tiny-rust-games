[package]
name = "tic-tac-toe-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/matthewscottconroy/tiny-rust-games"
keywords = ["game", "tic-tac-toe", "gamedev", "board-game", "engine-agnostic"]
categories = ["game-development", "games"]
readme = "README.md"
description = "Engine-agnostic tic-tac-toe rules"

# Public items must carry `///` docs; CI runs clippy with `-D warnings`.
[lints.rust]
missing_docs = "warn"

[dev-dependencies]
proptest = "1"
