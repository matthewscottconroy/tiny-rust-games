<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-rust-games — demo catalogue</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --text: #e8eaed; --dim: #9aa0a6;
    --line: #2c3038; --bevy: #b48ead; --godot: #81a1c1; --brackets: #a3be8c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { padding: 2rem 1.5rem 1rem; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
  p.lede { margin: 0 0 1.2rem; color: var(--dim); }
  .controls { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  input[type=search] { flex: 1 1 260px; padding: .6rem .8rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 1rem; }
  button { padding: .5rem .9rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: .9rem; }
  button[aria-pressed="true"] { color: var(--text); border-color: currentColor; }
  button[data-engine="bevy"][aria-pressed="true"] { color: var(--bevy); }
  button[data-engine="godot"][aria-pressed="true"] { color: var(--godot); }
  button[data-engine="brackets"][aria-pressed="true"] { color: var(--brackets); }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem 4rem;
          display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  article { background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; padding: .9rem 1rem; }
  article h2 { margin: 0 0 .2rem; font-size: 1rem; font-family: ui-monospace, monospace; }
  article h2 a { color: inherit; text-decoration: none; }
  article h2 a:hover { text-decoration: underline; }
  .tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  .tag.bevy { color: var(--bevy); } .tag.godot { color: var(--godot); }
  .tag.brackets { color: var(--brackets); }
  .summary { margin: .35rem 0 .4rem; }
  .teaches { color: var(--dim); font-size: .9rem; margin: 0; }
  .meta { margin-top: .5rem; color: var(--dim); font-size: .78rem; }
  #count { color: var(--dim); font-size: .9rem; }
  .empty { grid-column: 1/-1; color: var(--dim); padding: 2rem 0; }
</style>
</head>
<body>
<header>
  <h1>tiny-rust-games — demo catalogue</h1>
  <p class="lede">151 demos across three engines. Generated from each demo's
  own module documentation, so it cannot drift from the source.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search concepts, e.g. pathfinding, shader, signal…" autofocus>
    <button data-engine="all" aria-pressed="true">All</button>
    <button data-engine="bevy" aria-pressed="false">Bevy</button>
    <button data-engine="godot" aria-pressed="false">Godot</button>
    <button data-engine="brackets" aria-pressed="false">bracket-lib</button>
  </div>
  <p id="count"></p>
</header>
<main id="grid"></main>
<script>
const DEMOS = [{"name": "ability-cooldowns", "engine": "bevy", "summary": "Ability Cooldowns — a reusable Bevy plugin", "teaches": "Each ability is a plain Ability struct with a cooldown_max and cooldown_remaining. is_ready, cooldown_fraction, tick_ability, and use_ability are pure functions that require no Bevy types and can be tested in isolation. Three abilities (Dash, Shield, Nova) have different cooldown lengths. Each has a visual fill-bar that shows charge progress from 0 % to 100 %. Pressing a key while an ability is on cooldown does nothing; the bar gives clear feedback without any additional state. Layout tunables live in AbilityCooldownsConfig so setup and the UI system stay in sync.", "controls": "Q — Dash (1 s)   W — Shield (3 s)   E — Nova (8 s)", "path": "tech-demos/bevy/ability-cooldowns", "tests": 11}, {"name": "achievement-system", "engine": "bevy", "summary": "Achievement system — a reusable Bevy plugin", "teaches": "A AchievementRegistry resource holds all achievements as a Vec. Each has a goal, a live progress, and an unlocked flag. is_unlocked and achievement_fraction are pure functions used for both unlock detection and HUD progress-bar rendering. check_achievements runs every frame, comparing the latest counters against each achievement's goal and firing an UnlockMsg on the first frame a goal is reached. HUD rows are individual ECS entities; update_hud rewrites them only when the registry has changed, keeping frame cost low.", "controls": "SPACE — score a point; W/A/S/D — count movement steps;", "path": "tech-demos/bevy/achievement-system", "tests": 12}, {"name": "ascii-npc-sim", "engine": "bevy", "summary": "ASCII NPC simulation — a reusable, headless Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/ascii-npc-sim", "tests": 12}, {"name": "audio", "engine": "bevy", "summary": "Audio — a reusable Bevy plugin for background music and triggered SFX", "teaches": "Sounds are generated in code, not loaded from disk. Tone describes a waveform and render_tone turns it into PCM samples, which are wrapped in an AudioSource and added to Assets&lt;AudioSource&gt; directly. That keeps the demo runnable with no asset files to fetch, and makes the sound itself unit-testable. PlaybackSettings::LOOP keeps the pad playing; PlaybackSettings::DESPAWN cleans up one-shot entities when they finish, preventing accumulation. Tune pitch, duration, and volume through AudioConfig.", "controls": "SPACE — play the blip.", "path": "tech-demos/bevy/audio", "tests": 7}, {"name": "behavior-tree", "engine": "bevy", "summary": "Behavior Tree — a reusable Bevy plugin for composable AI decisions", "teaches": "The tree is plain data (BtNode) built by build_guard_bt and ticked by the pure tick_node / eval_leaf functions — fully unit-testable without a World. NodeStatus and LeafKind form the node contract; Sequence and Selector compose leaves into decisions. Sensing thresholds live in SIGHT_RANGE / ATTACK_RANGE; movement and window tunables live in BehaviorTreeConfig.", "controls": "WASD / Arrow keys — move the player.", "path": "tech-demos/bevy/behavior-tree", "tests": 7}, {"name": "boids-flocking", "engine": "bevy", "summary": "Boids flocking — a reusable Bevy plugin", "teaches": "Three steering rules produce emergent flocking with no central controller. Positions are snapshotted into a Vec each frame so we can read all boids while mutably updating them — Bevy's borrow checker forbids reading and writing the same query simultaneously. Screen-wrap prevents boids from flying off into infinity. Golden-ratio angle spread gives well-distributed initial velocities without needing a rand crate.", "controls": "", "path": "tech-demos/bevy/boids-flocking", "tests": 8}, {"name": "bullet-pattern", "engine": "bevy", "summary": "Bullet-pattern (danmaku) — a reusable Bevy plugin", "teaches": "radial_directions produces N evenly-spaced unit vectors for a burst. spiral_angle advances an angle by a fixed rate each frame for a spiral. aimed_direction points toward a target position. Three emitter patterns — radial burst, continuous spiral, aimed — switch with 1/2/3 keys. Bullets are simple Sprite entities with a Velocity component and a lifetime countdown. Despawning happens in tick_bullets.", "controls": "1/2/3 — change pattern; bullets auto-fire.", "path": "tech-demos/bevy/bullet-pattern", "tests": 13}, {"name": "camera-follow", "engine": "bevy", "summary": "Camera-follow — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/camera-follow", "tests": 8}, {"name": "card-game", "engine": "bevy", "summary": "Card game — a reusable Bevy plugin", "teaches": "A Deck resource holds three Vec&lt;Card&gt; piles: draw, hand, discard. shuffle uses an in-place LCG Fisher-Yates to randomise without rand. draw_card moves the top card from draw → hand (recycling discard when the draw pile empties). play_card moves a card from hand → discard by index. hand_value sums the numeric value of cards currently in hand. Cards are rendered as coloured sprites; the hand fans out across the bottom of the screen. Clicking a hand card plays it. Tune the layout and starting seed through the CardGameConfig resource.", "controls": "SPACE — draw a card;  left-click a hand card — play it.", "path": "tech-demos/bevy/card-game", "tests": 14}, {"name": "circle-buttons", "engine": "bevy", "summary": "Circle-buttons GUI — a reusable Bevy plugin", "teaches": "", "controls": "move the mouse to highlight, left-click to select.", "path": "tech-demos/bevy/circle-buttons", "tests": 16}, {"name": "collision-detection", "engine": "bevy", "summary": "AABB collision detection — a reusable Bevy plugin", "teaches": "aabb_overlap is a pure function — no physics engine needed. mtv (Minimum Translation Vector) resolves an overlap by the smallest possible push along either axis, preventing sprites from tunnelling. Collision pairs are found with a brute-force O(n²) loop; for larger entity counts a spatial hash or BVH would replace this.", "controls": "", "path": "tech-demos/bevy/collision-detection", "tests": 10}, {"name": "combo-system", "engine": "bevy", "summary": "Combo system — a reusable Bevy plugin for input-buffer sequence matching", "teaches": "A fixed-length input buffer stores the most recent key presses as a VecDeque&lt;KeyCode&gt;. Old entries fall off the back when the buffer reaches its capacity. matches_sequence checks whether the *tail* of the buffer equals a given pattern, so a combo fires at the moment its last input is pressed. Recognised combos flash a coloured banner and add to the score; the buffer is cleared after a match to prevent overlap. Controls are arrow keys (directional) and WASD (alternative bindings). Tune the buffer capacity and flash duration via ComboSystemConfig.", "controls": "Arrow keys / WASD — enter inputs and trigger combos.", "path": "tech-demos/bevy/combo-system", "tests": 7}, {"name": "crafting-system", "engine": "bevy", "summary": "Crafting system — a reusable Bevy plugin for inventory collection and recipe matching", "teaches": "Items are scattered around the arena as pickup entities. can_craft checks whether the inventory satisfies a recipe's ingredient list — a pure function over an inventory map and a Recipe. consume_ingredients removes items from an inventory HashMap, also pure. Walking into a pickup collects it; pressing C at a workbench opens the recipe list and pressing 1–4 attempts to craft the highlighted recipe. Tune the arena size, player speed, and interaction radii via CraftingSystemConfig.", "controls": "WASD — move   C near workbench — craft   1–4 — choose recipe", "path": "tech-demos/bevy/crafting-system", "tests": 8}, {"name": "custom-shader", "engine": "bevy", "summary": "Custom WGSL shader — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/custom-shader", "tests": 7}, {"name": "cutscene-sequencer", "engine": "bevy", "summary": "# Cutscene Sequencer — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/cutscene-sequencer", "tests": 15}, {"name": "day-night-cycle", "engine": "bevy", "summary": "Day-night cycle — a reusable Bevy plugin", "teaches": "DayClock tracks the virtual hour in [0.0, 24.0) and a speed multiplier (virtual hours per real second). time_of_day_to_rgb is a pure function that blends between four key colours (night → dawn → day → dusk) using linear interpolation, so it is easy to unit-test without touching Bevy's Color type. lerp_f32 and hours_to_label are extracted as testable helpers. The ClearColor resource is updated every frame so the background transitions smoothly; foreground objects (stars, a sun/moon disc, and silhouette hills) help sell the time of day visually.", "controls": "+ / = — speed up time   -  — slow down   R — reset to midnight.", "path": "tech-demos/bevy/day-night-cycle", "tests": 10}, {"name": "destructible-terrain", "engine": "bevy", "summary": "Destructible Terrain — a reusable Bevy plugin", "teaches": "Wall tiles carry a Tile { hp, max_hp } component. damage_tile is a pure function that returns Some(new_hp) or None (destroyed). tile_color maps the hp fraction to a visual crack gradient. The player can walk freely on floor tiles and press SPACE to attack the wall tile directly in front of their facing direction. Destroying a wall despawns the entity, permanently opening that cell.", "controls": "WASD / Arrows — move   SPACE — attack facing wall", "path": "tech-demos/bevy/destructible-terrain", "tests": 8}, {"name": "dialog-system", "engine": "bevy", "summary": "Dialog system — a reusable Bevy plugin", "teaches": "A dialog tree is a Vec&lt;DialogNode&gt;, where each node holds speaker name, full text, and a list of (label, next_node_id) choices. advance_dialog is a pure function: given the current node and a choice index it returns the next node ID, or None when the index is out of range or the choice list is empty (conversation ended). visible_text slices a &amp;str safely by char count so non-ASCII text is never split mid-codepoint. A typing timer drives char_index forward over time; once all characters are shown, the choices are revealed. Press SPACE to skip typing / advance on nodes with no choices. Press 1, 2, or 3 to pick a choice.", "controls": "SPACE — advance / skip typing   1 / 2 / 3 — choose.", "path": "tech-demos/bevy/dialog-system", "tests": 10}, {"name": "drag-and-drop", "engine": "bevy", "summary": "Drag-and-drop — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/drag-and-drop", "tests": 13}, {"name": "draw-window", "engine": "bevy", "summary": "Draw window demo — the absolute minimum Bevy app that opens a window", "teaches": "", "controls": "", "path": "tech-demos/bevy/draw-window", "tests": 0}, {"name": "ecs-ascii-sim", "engine": "bevy", "summary": "ECS ASCII-grid NPC simulation — a reusable, headless Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/ecs-ascii-sim", "tests": 24}, {"name": "enemy-chase-ai", "engine": "bevy", "summary": "Enemy chase AI — a reusable Bevy plugin", "teaches": "Enemies spawn periodically at the screen edge using a repeating Timer. Each Enemy queries the player's position and steers toward it each frame. No rand crate needed: golden-ratio angle stepping (2π/φ²) distributes spawn points uniformly around a circle with no clustering. See next_spawn_angle and spawn_point.", "controls": "", "path": "tech-demos/bevy/enemy-chase-ai", "tests": 7}, {"name": "events", "engine": "bevy", "summary": "Events (Message API) — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/events", "tests": 9}, {"name": "fixed-timestep", "engine": "bevy", "summary": "Fixed-timestep — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/fixed-timestep", "tests": 11}, {"name": "floating-text", "engine": "bevy", "summary": "Floating text — a reusable Bevy plugin for world-space damage numbers", "teaches": "Text2d places text in world space so it moves with the game camera, unlike UI Text which is anchored to the screen. Each FloatingText entity has a lifetime and upward velocity; its alpha fades linearly to 0 as the lifetime expires, then the entity despawns. Clicking in the game world spawns a random damage number at the cursor.", "controls": "left-click anywhere to spawn a damage number.", "path": "tech-demos/bevy/floating-text", "tests": 9}, {"name": "flow-field-pathfinding", "engine": "bevy", "summary": "# Flow-Field Pathfinding — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/flow-field-pathfinding", "tests": 11}, {"name": "fog-of-war", "engine": "bevy", "summary": "Fog-of-war — a reusable Bevy plugin for three-state tile visibility", "teaches": "cells_in_radius enumerates every cell within a circle of a given radius using integer arithmetic so there is no floating-point drift. is_within_radius is the fast per-cell test that drives the state logic. The player moves on a grid; sight updates every step, feeding the Revealed resource that remembers everywhere it has ever seen.", "controls": "WASD / Arrow keys — move player.", "path": "tech-demos/bevy/fog-of-war", "tests": 7}, {"name": "gamepad-input", "engine": "bevy", "summary": "Gamepad input — a reusable Bevy plugin", "teaches": "Bevy 0.14+ exposes gamepads as ECS entities; Query&lt;&amp;Gamepad&gt; iterates all connected pads. gamepad.pressed(GamepadButton::South) checks digital buttons. gamepad.get(GamepadAxis::LeftStickX).unwrap_or(0.0) reads analog axes. A dead-zone magnitude threshold (apply_deadzone) prevents stick drift from moving the sprite when the stick is near center. WASD / arrow keys provide an identical keyboard fallback (keyboard_axis) so the demo is usable without a controller.", "controls": "", "path": "tech-demos/bevy/gamepad-input", "tests": 10}, {"name": "grid-movement", "engine": "bevy", "summary": "Grid movement — a reusable Bevy plugin", "teaches": "GridPos(IVec2) is the authoritative position in grid space. just_pressed() fires once per keypress, giving clean one-cell-per-tap movement. Transform is derived from GridPos each frame via sync_transform. Movement rules live in pure functions (input_delta, step, grid_to_world), so they are testable without a World and liftable.", "controls": "", "path": "tech-demos/bevy/grid-movement", "tests": 12}, {"name": "health-and-damage", "engine": "bevy", "summary": "Health and damage — a reusable Bevy plugin", "teaches": "Enemy holds HP as a plain component field; damage flows through a DamageMessage so the input system is decoupled from the HP system. Sprite color lerps from green (full HP) to red (near death) via Enemy::fraction. Entity despawns on death; a RespawnTimer triggers a fresh spawn.", "controls": "", "path": "tech-demos/bevy/health-and-damage", "tests": 9}, {"name": "hello-plugin", "engine": "bevy", "summary": "Hello plugin — wrapping systems in a reusable Bevy Plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/hello-plugin", "tests": 5}, {"name": "hello-world", "engine": "bevy", "summary": "Hello world — the minimal Bevy ECS building block", "teaches": "", "controls": "", "path": "tech-demos/bevy/hello-world", "tests": 2}, {"name": "hex-grid", "engine": "bevy", "summary": "Hexagonal grid — a reusable Bevy plugin", "teaches": "Axial coordinates (q, r) represent hex positions without the diagonal ambiguity of offset grids. axial_to_pixel converts axial coords to flat-top pixel centres. pixel_to_axial rounds a pixel position back to the nearest hex. hex_neighbors enumerates the 6 adjacent cells. axial_distance gives the hex-grid Manhattan distance between two cells. Clicking a hex selects it and highlights its neighbours.", "controls": "left-click — select hex;  R — reset selection.", "path": "tech-demos/bevy/hex-grid", "tests": 10}, {"name": "hud-and-ui", "engine": "bevy", "summary": "HUD and UI — a reusable Bevy plugin", "teaches": "Score and PlayerHealth are plain resources; UI text entities mirror them each frame. is_changed() guards the update systems so they only rewrite text when the underlying data actually changes. The health bar uses a nested UI node whose width shrinks as HP drops.", "controls": "", "path": "tech-demos/bevy/hud-and-ui", "tests": 6}, {"name": "inventory-ui", "engine": "bevy", "summary": "Grid-based inventory UI demo — a reusable Bevy plugin", "teaches": "An 8×5 ItemGrid resource maps (col, row) slots to Option&lt;Item&gt;. slot_world_pos converts a grid coordinate to a world-space position, keeping layout logic out of systems. find_slot_at does the reverse: maps a cursor position back to (col, row). first_empty_slot scans for an open slot — used when picking up a drop. Left-clicking a filled slot picks up the item; clicking an empty slot drops the held item there.  The HUD shows what's currently held.", "controls": "left-click — pick up / place item;  R — reset grid.", "path": "tech-demos/bevy/inventory-ui", "tests": 10}, {"name": "knockback-hitstop", "engine": "bevy", "summary": "Knockback &amp; Hit-Stop — a reusable Bevy plugin for satisfying combat feel", "teaches": "On a successful attack, the target receives a velocity impulse directed away from the attacker (knockback_dir is a pure Vec2 function). Velocity decays each frame with exponential-style friction (decay_vel). Hit-stop: the game briefly slows enemy physics to ~5 % speed for a fraction of a second, creating a visceral pause on impact. Implemented as a HitStop resource that scales effective_dt — no Bevy time manipulation needed. Screen shake on the player camera for one second after each hit.", "controls": "WASD / Arrows — move   SPACE — attack nearby enemies", "path": "tech-demos/bevy/knockback-hitstop", "tests": 6}, {"name": "lighting-2d", "engine": "bevy", "summary": "Simulated 2D lighting — a reusable Bevy plugin", "teaches": "Each tile sprite's colour is recomputed every frame from light_intensity, a pure function that accumulates contributions from all active lights using a smooth quadratic falloff. apply_light_intensity scales a base RGB tuple by the computed intensity, keeping the colour arithmetic free of Bevy types and trivially testable. Three floating point lights orbit the arena; the player carries a fourth light that moves with WASD.  An adjustable ambient floor prevents total darkness. The approach uses no custom shaders or Bevy lighting components — just per-frame sprite colour updates — making it fully cross-platform.", "controls": "WASD / Arrow keys — move player light   + / - — raise / lower ambient.", "path": "tech-demos/bevy/lighting-2d", "tests": 6}, {"name": "line-of-sight", "engine": "bevy", "summary": "Line-of-sight — a reusable Bevy plugin", "teaches": "bresenham_cells returns every grid cell a line passes through, using the classic integer error-accumulation algorithm. can_see walks those cells and returns false the moment a wall is hit, giving per-cell visibility from the player's position. Each frame all tiles are recoloured based on whether the player can see them: fully-lit (visible), dim (previously seen), or black (unknown). The player moves on the same grid; walls block sight but not the HUD.", "controls": "WASD / Arrow keys — move player.", "path": "tech-demos/bevy/line-of-sight", "tests": 7}, {"name": "loot-table", "engine": "bevy", "summary": "Loot table — a reusable Bevy plugin for weighted random item drops", "teaches": "A loot table is a slice of (Item, weight) pairs. total_weight sums all weights; roll_loot picks an item whose cumulative bucket contains roll % total_weight. A deterministic LCG (lcg_next) replaces rand, keeping the demo dependency-free while still producing varied drops. Enemies are killed by clicking on them; each kill advances the RNG state and selects a drop.  Drops float upward briefly, then despawn. The inventory accumulates in a Resource and is rendered in a label.", "controls": "left-click a red square to kill the enemy and collect a drop.", "path": "tech-demos/bevy/loot-table", "tests": 11}, {"name": "menu-navigation", "engine": "bevy", "summary": "Menu-navigation — a reusable Bevy plugin for an arrow-key navigable menu", "teaches": "MenuState resource tracks the highlighted index; it wraps around at the top and bottom so the user can hold a direction continuously. Each MenuItem entity carries its index so the color-sync system does not need to maintain a separate lookup. Pressing ENTER on \"Start Game\" pushes the AppState::InGame state; ESC from InGame returns to the menu. All menu entities are tagged with OnMainMenu and despawned on exit to keep state transitions clean.", "controls": "Up/Down arrows to navigate; ENTER to select; ESC to return.", "path": "tech-demos/bevy/menu-navigation", "tests": 9}, {"name": "minimap", "engine": "bevy", "summary": "Minimap demo — two Camera2d instances in one window, as a reusable plugin", "teaches": "A main camera (render order 0) follows the player with an exponential lerp, keeping them centred on screen. A minimap camera (render order 1) is fixed at the world centre with a high orthographic scale so the entire play area fits in a small viewport rendered into the top-right corner of the window. Camera::viewport lets each camera draw into an independent rectangular region of the same window surface — no render targets required.", "controls": "WASD to move the player.", "path": "tech-demos/bevy/minimap", "tests": 12}, {"name": "mouse-input", "engine": "bevy", "summary": "Mouse input demo — a reusable Bevy plugin", "teaches": "cursor_to_world converts window pixel coordinates to Bevy world space via Camera::viewport_to_world_2d — this conversion is required any time you want to act on where the user clicked in the game world. Drag state is tracked in a DragState resource; on left-press the closest entity within its radius is picked, on left-release it is dropped. Hover is detected every frame by comparing cursor distance to each entity.", "controls": "", "path": "tech-demos/bevy/mouse-input", "tests": 4}, {"name": "movable-sprite", "engine": "bevy", "summary": "Movable sprite — WASD movement applied to a sprite entity", "teaches": "", "controls": "", "path": "tech-demos/bevy/movable-sprite", "tests": 6}, {"name": "noise-map", "engine": "bevy", "summary": "Noise map — procedural terrain using seeded value noise and fractal layering, as a reusable Bevy plugin", "teaches": "hash2 converts a grid cell (x, y) and a seed into a deterministic float in 0, 1 using integer arithmetic (no external crate needed). value_noise bilinearly interpolates between the four corner hashes of the cell that contains (x, y), using smoothstep for C¹ continuity. fbm (fractal Brownian motion) stacks multiple octaves at halving amplitude and doubling frequency to create natural multi-scale features. biome_color maps a height value to a colour tier: deep water, shallow water, sand, grass, rock, snow. Pressing SPACE re-seeds the map and repaints all tiles in one frame.", "controls": "SPACE — regenerate map with a new seed.", "path": "tech-demos/bevy/noise-map", "tests": 12}, {"name": "notification-system", "engine": "bevy", "summary": "Notification system — a reusable Bevy plugin for timed UI toasts", "teaches": "Any system sends a NotifyMessage to queue a new toast. Each notification is an ECS entity tagged Notification; it is despawned automatically when its elapsed time exceeds its lifetime. notification_alpha computes the opacity, fading from 1 to 0 over the last fade_secs seconds of the lifetime. layout_notifications repositions surviving toasts in a vertical stack (oldest at the bottom, newest at the top) every frame. Tunables live in NotificationConfig; override before adding the plugin.", "controls": "", "path": "tech-demos/bevy/notification-system", "tests": 10}, {"name": "object-pooling", "engine": "bevy", "summary": "Object pooling — a reusable Bevy plugin that recycles bullet entities", "teaches": "All bullets are spawned at startup as invisible/inactive entities. Shooting does *not* spawn a new entity; it activates the next available slot in the pool. Despawning is replaced by deactivation (hide and freeze the bullet). find_inactive is a pure function that scans a slice of booleans and returns the first false index, mirroring what the ECS system does. is_off_screen is a pure function that decides when to deactivate a bullet by comparing its position to the window half-extents. The HUD shows how many pool slots are currently active vs. the total pool size, making the recycling behaviour visible. Tunables live in PoolConfig; override before adding the plugin.", "controls": "SPACE or Left-Click — fire a bullet.", "path": "tech-demos/bevy/object-pooling", "tests": 8}, {"name": "observer-events", "engine": "bevy", "summary": "Observer events — a reusable Bevy plugin comparing two event delivery styles", "teaches": "", "controls": "", "path": "tech-demos/bevy/observer-events", "tests": 10}, {"name": "one-shot-systems", "engine": "bevy", "summary": "One-shot systems — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/one-shot-systems", "tests": 15}, {"name": "parallax-background", "engine": "bevy", "summary": "Parallax background — a reusable Bevy plugin", "teaches": "Each background layer stores a scroll_factor (0 = static, 1 = moves with the world at full speed). Every frame each layer's world X is set to camera_x * scroll_factor. Layers with lower factors appear to be farther away because they move less as the camera pans.", "controls": "", "path": "tech-demos/bevy/parallax-background", "tests": 8}, {"name": "particle-system", "engine": "bevy", "summary": "Particle system — a reusable Bevy plugin", "teaches": "Particles are regular ECS entities with a Particle component that holds lifetime, velocity, and color state.  No special engine feature is needed. Rng is a deterministic linear congruential generator (LCG) that replaces the rand crate — zero extra dependencies. Burst emitter (SPACE) spawns many particles at once. Continuous emitter (fixed position) trickles particles every 40 ms. Alpha fades from 1 → 0 as lifetime runs down; entity despawns at 0.", "controls": "", "path": "tech-demos/bevy/particle-system", "tests": 8}, {"name": "pathfinding", "engine": "bevy", "summary": "Pathfinding — a reusable Bevy plugin", "teaches": "The grid is a Vec&lt;Vec&lt;bool&gt;&gt; where true means \"walkable\". astar is a pure function: it takes the grid, start, and goal cells and returns a Vec&lt;IVec2&gt; path (or None if unreachable). It is the star of this demo and is thoroughly unit-tested. The Seeker component stores the current path and a move timer so it steps cell-by-cell at a readable pace. The player moves on the same grid with arrow keys; the seeker recomputes its path each time the player moves.", "controls": "Arrow keys / WASD to move the player (cyan).", "path": "tech-demos/bevy/pathfinding", "tests": 10}, {"name": "pickup-and-inventory", "engine": "bevy", "summary": "Pickup and inventory — a reusable Bevy plugin", "teaches": "Proximity pickup: each frame the player's position is compared to every Pickup and items within PickupConfig::pickup_radius are collected. Inventory is a plain resource with count and max — no complex data structure needed. Dropping spawns a new Pickup entity at the player's current position. When all pickups are collected a RespawnTimer schedules a fresh batch.", "controls": "WASD to move, Q to drop an item.", "path": "tech-demos/bevy/pickup-and-inventory", "tests": 7}, {"name": "pixel-perfect-camera", "engine": "bevy", "summary": "Pixel-perfect camera — a reusable Bevy plugin", "teaches": "The camera uses ScalingMode::Fixed { width, height }, which makes the orthographic projection treat the window as exactly the virtual resolution regardless of the real window size. When the window is an exact integer multiple of the virtual resolution (e.g. 1280×720 = 4× 320×180), every virtual pixel maps to a square block of real pixels with no sub-pixel blur. All entity positions are snapped to a grid via snap_to_grid before rendering so sprites never land between pixel boundaries. Player movement uses just_pressed so each keypress advances exactly one grid cell.", "controls": "WASD (one grid step per press).", "path": "tech-demos/bevy/pixel-perfect-camera", "tests": 12}, {"name": "platformer-physics", "engine": "bevy", "summary": "Platformer-physics — a reusable Bevy plugin", "teaches": "Physics (apply_gravity, move_and_collide) runs in FixedUpdate for deterministic stepping independent of frame rate. Input is read in Update and written into Player fields; FixedUpdate systems consume those fields, avoiding a per-frame input miss. Coyote time lets the player jump for a brief window after walking off a ledge (they were recently grounded but haven't jumped yet). Jump buffer remembers a jump press that arrived slightly before the player landed, consuming it on the next grounded frame. Collision resolution is factored into aabb_penetration, a pure function that is unit-testable without a World.", "controls": "A/D or arrow keys to move; SPACE or W/Up to jump.", "path": "tech-demos/bevy/platformer-physics", "tests": 7}, {"name": "procedural-dungeon", "engine": "bevy", "summary": "Procedural dungeon — a reusable Bevy plugin", "teaches": "A Rect represents a region of the grid; split_room bisects it along a chosen axis, returning two child rects only when both children meet the minimum size constraint. build_dungeon iteratively applies BSP splits, shrinks each leaf region into a room (room_interior), and connects adjacent rooms with an L-shaped corridor. It is a pure function, unit-testable without a World. A lightweight LCG (lcg_next) produces all random decisions without any external dependency. Press SPACE to regenerate with a new seed.", "controls": "SPACE — regenerate dungeon.", "path": "tech-demos/bevy/procedural-dungeon", "tests": 9}, {"name": "projectiles", "engine": "bevy", "summary": "Projectiles — a reusable Bevy plugin", "teaches": "Bullets are spawned at runtime as plain ECS entities; no object pool needed. Each bullet carries a Velocity component and moves every Update frame. Off-screen bullets are despawned each frame to keep entity count bounded. Tunables live in ProjectilesConfig; override it before adding the plugin.", "controls": "", "path": "tech-demos/bevy/projectiles", "tests": 11}, {"name": "rabbit_carrot_wolf", "engine": "bevy", "summary": "Rabbit / carrot / wolf ecosystem simulation — a reusable Bevy plugin", "teaches": "Three species (rabbits, wolves, carrots) interact through proximity checks. Rabbits eat carrots and reproduce; wolves eat rabbits and reproduce. Each animal has an age/lifespan field — entities despawn when age exceeds lifespan. bevy_egui drives the config menu and the live population HUD. Tune it through the SimulationConfig resource.", "controls": "configure species counts in the egui menu, then click Play.", "path": "tech-demos/bevy/rabbit_carrot_wolf", "tests": 7}, {"name": "required-components", "engine": "bevy", "summary": "Required components — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/required-components", "tests": 15}, {"name": "rope-simulation", "engine": "bevy", "summary": "Rope simulation — Verlet integration with iterative distance constraints", "teaches": "Each node stores its current and previous position; velocity is implicit in the difference pos − prev (Störmer–Verlet scheme). verlet_step integrates one timestep: new = 2·pos − prev + accel·dt². constrain_segment enforces the rest-length between adjacent nodes using equal-mass Jacobi relaxation; multiple passes per frame produce a stiffer rope. Node 0 is pinned to the mouse cursor each frame before the constraint solve, so the rope hangs from wherever the cursor sits. All rope state lives in a single Rope resource; transforms are synced from it after simulation. Tunables (node count, rest length, gravity, iterations…) live in RopeConfig; override it before adding the plugin.", "controls": "move the mouse — the rope hangs from the cursor position.", "path": "tech-demos/bevy/rope-simulation", "tests": 9}, {"name": "rubber-band-selection", "engine": "bevy", "summary": "Rubber-band (marquee) selection — RTS-style drag-to-select", "teaches": "", "controls": "", "path": "tech-demos/bevy/rubber-band-selection", "tests": 14}, {"name": "save-load", "engine": "bevy", "summary": "Save / load — a reusable Bevy plugin persisting a resource to disk as JSON", "teaches": "serde + serde_json serialize the SaveData resource to a JSON file. On startup we try to load an existing save; if none exists we use defaults. S saves, L loads explicitly, SPACE increments score, R resets. The save file path is relative to the working directory (the directory where cargo run is invoked).", "controls": "", "path": "tech-demos/bevy/save-load", "tests": 6}, {"name": "scene-pause", "engine": "bevy", "summary": "Scene pause — a reusable Bevy plugin", "teaches": "GameState drives which systems run via run_if(in_state(...)). OnEnter / OnExit schedules handle one-shot overlay show/hide. Physics systems only run in GameState::Running; the pause overlay is only visible in GameState::Paused. Tune the arena bounds through the ScenePauseConfig resource.", "controls": "", "path": "tech-demos/bevy/scene-pause", "tests": 8}, {"name": "scene-transition", "engine": "bevy", "summary": "Scene transition — a reusable Bevy plugin", "teaches": "Three distinct app states in AppState. OnEnter spawns scene-specific entities tagged with a marker component. OnExit calls the generic cleanup system to despawn all tagged entities. A fake loading bar in the Loading state demonstrates the \"loading screen\" pattern: do work (or just wait), then call NextState when ready. Tune loading duration, arena bounds, and score value via SceneTransitionConfig.", "controls": "", "path": "tech-demos/bevy/scene-transition", "tests": 9}, {"name": "screen-shake", "engine": "bevy", "summary": "Screen-shake — a reusable Bevy plugin using the trauma/decay pattern", "teaches": "A Trauma resource holds a value in 0.0, 1.0. Intensity is squared (trauma²) so high trauma feels violent while low trauma feels gentle. Two orthogonal sine waves at incommensurable frequencies produce an organic, non-repeating shake rather than a regular oscillation. Trauma decays by trauma_decay units per second; it never goes negative.", "controls": "", "path": "tech-demos/bevy/screen-shake", "tests": 7}, {"name": "screen-wrap", "engine": "bevy", "summary": "Screen wrap — a reusable Bevy plugin", "teaches": "Query the primary Window for its dimensions and derive wrap boundaries at runtime, so it works regardless of window size. wrap_coord is a pure helper the systems reuse per axis. Tunables live in ScreenWrapConfig; override it before adding the plugin.", "controls": "", "path": "tech-demos/bevy/screen-wrap", "tests": 9}, {"name": "soft-body", "engine": "bevy", "summary": "Soft-body simulation — a spring-mass network without any physics plugin", "teaches": "Nodes are ECS entities with a position (via Transform) and a velocity (NodeVelocity). Springs live in a Springs resource, not entities. Each FixedUpdate tick: accumulate spring_force deltas per node in a HashMap (no aliasing), apply them to velocities, then integrate positions with damp_velocity and gravity for all non-Pinned nodes. The top-left and top-right corner nodes are pinned and never move. Tunables (grid size, spacing, stiffness, damping, gravity…) live in SoftBodyConfig; override it before adding the plugin.", "controls": "", "path": "tech-demos/bevy/soft-body", "tests": 10}, {"name": "spatial-partitioning", "engine": "bevy", "summary": "Spatial partitioning — grid-cell bucketing to avoid checking every pair", "teaches": "The world is divided into a fixed-size grid. Each frame every entity is assigned to the cell that contains its position. Proximity checks only examine entities in the same cell and its 8 neighbours — a 3×3 patch — instead of checking every pair. cell_of and neighbour_cells are pure functions with no ECS dependency. The HUD compares the brute-force pair count (N*(N-1)/2) to the spatial check count, showing the savings as entities cluster or spread out.", "controls": "", "path": "tech-demos/bevy/spatial-partitioning", "tests": 8}, {"name": "sprite-demo", "engine": "bevy", "summary": "Sprite loading — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/sprite-demo", "tests": 3}, {"name": "spritesheet-animation", "engine": "bevy", "summary": "Spritesheet animation — a reusable Bevy plugin", "teaches": "A texture atlas is built programmatically at startup (four solid-color 32×32 frames) so the demo has no external asset dependency. AnimationTimer drives frame advances at a fixed interval. AnimationIndices stores the first/last frame so the animation can loop. In a real project, replace the programmatic atlas with asset_server.load(\"spritesheet.png\"). Tune the frame size, count, and speed through the SpritesheetAnimationConfig resource.", "controls": "", "path": "tech-demos/bevy/spritesheet-animation", "tests": 6}, {"name": "state-machine-ai", "engine": "bevy", "summary": "Per-entity state machine AI — a reusable Bevy plugin", "teaches": "EnemyState is a per-entity component enum — distinct from Bevy's global app States. Per-entity FSMs live in components, not NextState&lt;T&gt;. Transitions are driven by distance thresholds checked every frame. Each state runs different behavior in the same system, branching on the enum variant. Tune speeds and detection radii through the StateMachineAiConfig resource.", "controls": "", "path": "tech-demos/bevy/state-machine-ai", "tests": 9}, {"name": "status-effects", "engine": "bevy", "summary": "Status Effects — a reusable Bevy plugin for time-decaying debuffs", "teaches": "Each active Effect is a plain struct with a remaining duration and strength. tick_effect reduces the timer and returns None when the effect expires. total_dot_dps and speed_multiplier aggregate all active effects into a scalar damage rate and movement modifier — both pure and testable. The enemy's behaviour is entirely driven by these aggregated values each frame. Tune arena size, speeds, range, and cooldown through the StatusEffectsConfig resource.", "controls": "WASD / Arrows — move player   Q — Poison   W — Slow   E — Burn   R — Stun", "path": "tech-demos/bevy/status-effects", "tests": 8}, {"name": "stealth-ai", "engine": "bevy", "summary": "Stealth AI — a reusable Bevy plugin: FOV cone detection with Patrol / Alert / Chase guard states", "teaches": "in_fov_cone is a pure function that checks whether a target point falls inside a directional cone defined by an origin, a normalised forward vector, a half-angle, and a maximum range. The guard cycles through three states: Patrol — walks between two waypoints. Alert  — stops and looks toward where the player was spotted; transitions to Chase if the player stays in view, or back to Patrol after a timeout. Chase  — runs directly toward the last known player position. A coloured rectangle behind the guard visualises the detection state. The player moves freely; the guard's FOV cone is drawn as a fan of thin sprites approximating an arc.", "controls": "WASD / Arrow keys — move player.", "path": "tech-demos/bevy/stealth-ai", "tests": 8}, {"name": "tilemap", "engine": "bevy", "summary": "Tilemap — a reusable Bevy plugin", "teaches": "A const string-slice array (MAP) encodes tile types compactly. Tile sprites are spawned as children of a single root entity so that moving or scaling the root transforms the entire map. Two tile types (# = wall, . = floor) are distinguished by color; space characters are skipped (void tiles).", "controls": "", "path": "tech-demos/bevy/tilemap", "tests": 8}, {"name": "time-scale", "engine": "bevy", "summary": "Time-scale — a reusable Bevy plugin demonstrating the virtual-time API", "teaches": "Time&lt;Virtual&gt; is the game clock that drives time.delta_secs(). set_relative_speed(f) multiplies every delta by f, instantly making all virtual-time–driven systems run faster or slower. pause() / unpause() freeze the virtual clock without affecting Time&lt;Real&gt; (wall time), so the window still responds to input. Orbiting sprites use the virtual clock so they obey the scale factor; the HUD uses a fixed string update rather than Time&lt;Virtual&gt; so the label always reflects the true current speed.", "controls": "", "path": "tech-demos/bevy/time-scale", "tests": 7}, {"name": "turn-based", "engine": "bevy", "summary": "Turn-based combat — a reusable Bevy plugin", "teaches": "Each actor has hp, action_points (AP), and initiative. sort_by_initiative returns a sorted turn order (pure, testable). The turn loop alternates between PlayerTurn and EnemyTurn phases. During the player's turn, WASD moves (costs 1 AP) or bump-attacks an adjacent enemy (costs 2 AP).  SPACE ends the turn early. Enemies use a simple AI: step one cell toward the player, then end turn. step_toward and manhattan are pure helper functions. Dead actors are removed from the turn order; the game ends when all enemies (or the player) are defeated.", "controls": "WASD / Arrow keys — move or attack   SPACE — end turn.", "path": "tech-demos/bevy/turn-based", "tests": 8}, {"name": "tween-animation", "engine": "bevy", "summary": "Tween animation — a reusable Bevy plugin", "teaches": "A tween component holds from, to, duration, and elapsed state. The tween system advances elapsed and writes the interpolated value. smoothstep gives ease-in-out; ease_out_back overshoots for a \"pop\" feel. Three independent tween types (scale, position, alpha) share the same structure — only the applied field differs.", "controls": "", "path": "tech-demos/bevy/tween-animation", "tests": 12}, {"name": "two-players", "engine": "bevy", "summary": "Two-player movement — a reusable Bevy plugin", "teaches": "", "controls": "", "path": "tech-demos/bevy/two-players", "tests": 6}, {"name": "upgrade-tree", "engine": "bevy", "summary": "Upgrade Tree — branching skill unlock with prerequisite dependencies", "teaches": "The tree is a flat Vec&lt;UpgradeNode&gt; where each node stores its prerequisite indices. No graph library is required. can_unlock is a pure function: given the current unlocked set and available points, it checks both prerequisites and cost without touching Bevy. Nodes are coloured: dark-grey (locked prereqs), yellow (available), green (unlocked). The player earns skill points with SPACE and spends them by pressing 1–9.", "controls": "SPACE — earn a skill point   1–9 — unlock the matching node", "path": "tech-demos/bevy/upgrade-tree", "tests": 9}, {"name": "water-ripple", "engine": "bevy", "summary": "Water-ripple simulation demo — a reusable Bevy plugin", "teaches": "The discrete wave equation nexti = 2·curri − previ + c²·Δh propagates height values across a 2-D grid. ripple_step computes one cell's next height from its current neighbours, its previous value, and a damping factor. height_to_color maps h ∈ -1, 1 to a blue-tinted colour. The simulation runs on a fixed-timestep schedule (FixedUpdate) so the wave speed is frame-rate independent. Clicking the screen adds a disturbance at the nearest grid cell.", "controls": "left-click — add ripple.", "path": "tech-demos/bevy/water-ripple", "tests": 11}, {"name": "wave-spawner", "engine": "bevy", "summary": "Wave-spawner demo — a reusable Bevy plugin", "teaches": "WaveState tracks whether the simulation is in an active-wave phase or a between-wave countdown phase. Enemy count scales with wave number; enemies are despawned at wave end. Enemies are placed around the arena boundary using the golden-ratio angle to distribute them evenly without repeating clusters. The HUD shows the current wave, enemy count, and time remaining.", "controls": "passive — watch the waves spawn automatically.", "path": "tech-demos/bevy/wave-spawner", "tests": 8}, {"name": "weather-system", "engine": "bevy", "summary": "Weather System — a reusable Bevy plugin", "teaches": "Four weather states (Clear, Cloudy, Rainy, Stormy) cycle on a timer. sky_color, rain_intensity, and wind_force are pure functions of the current weather state — easy to test and tune without touching Bevy. Sky colour is applied to Bevy's ClearColor resource each frame. Rain particles are pooled: all exist at startup, toggled via Visibility. Wind is a Vec2 applied as a force to the player each frame.", "controls": "WASD / Arrows — move through the storm   R — advance weather", "path": "tech-demos/bevy/weather-system", "tests": 9}, {"name": "y-sort", "engine": "bevy", "summary": "Y-sort (depth sorting) — a reusable Bevy plugin", "teaches": "", "controls": "WASD — move", "path": "tech-demos/bevy/y-sort", "tests": 9}, {"name": "ability-cooldowns", "engine": "godot", "summary": "Ability Cooldowns GDExtension demo — a cooldown system for game abilities from Rust", "teaches": "Defining a plain Rust struct (Ability) to hold per-ability state. Ticking cooldowns every frame in process(). Exposing use_ability(index) and is_ready(index) as #func callables. Rendering a live HUD string on a Label child. Pure cooldown helpers (tick_cooldown, is_ready, cooldown_fraction, format_cooldown) fully covered by unit tests.", "controls": "", "path": "tech-demos/godot/ability-cooldowns", "tests": 12}, {"name": "achievement-system", "engine": "godot", "summary": "Achievement system demo — Godot 4.3 + gdext 0.5", "teaches": "Storing achievement state in a plain Rust struct (no Godot Resource needed). Pure functions for progress fraction, unlock detection, and display text. Refreshing a Label-based HUD from Rust each time state changes. Showing a brief unlock banner when an achievement is newly completed.", "controls": "S — add score;  W — step;  K — kill enemy;  ESC — reset.", "path": "tech-demos/godot/achievement-system", "tests": 13}, {"name": "animated-sprite", "engine": "godot", "summary": "Animated Sprite demo — switches between Idle, Walk, and Attack states based on user input, driving an AnimatedSprite2D child node", "teaches": "driving an AnimatedSprite2D child from a Rust state enum, and switching animations only when the state actually changes.", "controls": "", "path": "tech-demos/godot/animated-sprite", "tests": 12}, {"name": "animation-player", "engine": "godot", "summary": "Animation Player demo — controls an AnimationPlayer timeline from Rust: play, seek, adjust speed scale, and react to the animation_finished signal", "teaches": "controlling an AnimationPlayer timeline from Rust — play, seek, speed scale — and reacting to its animation_finished signal.", "controls": "", "path": "tech-demos/godot/animation-player", "tests": 9}, {"name": "area-detection", "engine": "godot", "summary": "area-detection: Demonstrates connecting Area2D body_entered / body_exited signals to Rust methods. Tracks overlap count and displays it on a Label", "teaches": "connecting Area2D body_entered / body_exited signals to Rust methods and tracking the resulting overlap count.", "controls": "", "path": "tech-demos/godot/area-detection", "tests": 6}, {"name": "audio-manager", "engine": "godot", "summary": "Audio Manager GDExtension demo — polyphonic SFX pool management from Rust", "teaches": "Managing a fixed pool of AudioStreamPlayer children for polyphonic playback. Loading an AudioStream resource at runtime and assigning it to a free player. stop_all() and set_master_volume() bulk operations on the player pool. Tracking play statistics via a play_count field. Pure audio-math helpers (db_to_linear, linear_to_db, clamp_volume) covered by unit tests.", "controls": "", "path": "tech-demos/godot/audio-manager", "tests": 9}, {"name": "callable-deferred", "engine": "godot", "summary": "Callable Deferred demo — call_deferred for safe scene-tree mutation from signal handlers; Callable::from_fn for inline Rust callbacks", "teaches": "why direct add_child inside a signal handler is unsafe; how call_deferred schedules an operation for the next idle frame; and how Callable::from_fn creates anonymous callable objects that Godot can invoke without a method name on a registered class.", "controls": "", "path": "tech-demos/godot/callable-deferred", "tests": 9}, {"name": "camera-follow", "engine": "godot", "summary": "Camera Follow demo — a Camera2D that smoothly lerps toward the first node in the \"player\" group, respecting a configurable dead zone", "teaches": "a Camera2D that lerps toward a target found by group lookup, with a dead zone so small movements do not jitter the view.", "controls": "", "path": "tech-demos/godot/camera-follow", "tests": 9}, {"name": "camera-zoom", "engine": "godot", "summary": "Camera zoom demo — Godot 4.3 + gdext 0.5", "teaches": "Driving Camera2D::set_zoom from Rust. clamp_zoom keeps zoom within designer-specified limits. lerp_zoom smoothly interpolates the camera toward the target zoom each frame. Reading mouse-wheel input via InputEventMouseButton and WHEEL_UP/DOWN. Panning the world with WASD while the zoom is applied.", "controls": "scroll wheel — zoom;  WASD — pan.", "path": "tech-demos/godot/camera-zoom", "tests": 8}, {"name": "canvas-layer", "engine": "godot", "summary": "Canvas Layer demo — a CanvasLayer keeps HUD elements fixed on screen while a Camera2D scrolls through the world. Demonstrates that UI pinned to a CanvasLayer is unaffected by camera movement", "teaches": "why HUD elements parented to a CanvasLayer stay fixed on screen while a Camera2D scrolls the world beneath them.", "controls": "", "path": "tech-demos/godot/canvas-layer", "tests": 7}, {"name": "collision-layers", "engine": "godot", "summary": "collision-layers: Demonstrates programmatic control of Godot collision layers and masks from Rust. Spawns StaticBody2D children and configures their layer / mask bits at runtime", "teaches": "setting collision layer and mask bits programmatically from Rust, and what each bit means for who collides with whom.", "controls": "", "path": "tech-demos/godot/collision-layers", "tests": 9}, {"name": "command-pattern", "engine": "godot", "summary": "Command Pattern demo — Godot 4.3 + gdext 0.5", "teaches": "an undo/redo stack built from Box&lt;dyn Command&gt; over a pure-Rust GameState, so the history logic is testable without Godot.", "controls": "", "path": "tech-demos/godot/command-pattern", "tests": 8}, {"name": "custom-resource", "engine": "godot", "summary": "Custom Resource GDExtension demo — Rust structs as first-class Godot Resources", "teaches": "defining a Resource subclass with #export fields, saving it as a .tres file, setting it in the Godot inspector, and reading it from a Node.  WeaponData is the Godot equivalent of a data class or ScriptableObject — it holds weapon stats and exposes computed properties via #func methods.", "controls": "", "path": "tech-demos/godot/custom-resource", "tests": 10}, {"name": "dialogue-tree", "engine": "godot", "summary": "Branching dialogue tree demo — Godot 4.3 + gdext 0.5", "teaches": "Representing a dialogue tree as a flat Vec of nodes with index-based edges. Pure functions for tree traversal decoupled from Godot types. Rendering dialogue and numbered choices via Label nodes created from Rust. Keyboard navigation (1–4 to pick choices, ESC to restart).", "controls": "1–4 — select choice;  ESC — restart dialogue.", "path": "tech-demos/godot/dialogue-tree", "tests": 11}, {"name": "drag-and-drop-ui", "engine": "godot", "summary": "drag-and-drop-ui: Demonstrates GUI input events and custom drawing in Rust. A colored rectangle can be clicked and dragged around the screen", "teaches": "handling Control::_gui_input and distinguishing InputEventMouseButton from InputEventMouseMotion while dragging.", "controls": "", "path": "tech-demos/godot/drag-and-drop-ui", "tests": 7}, {"name": "editor-plugin", "engine": "godot", "summary": "Editor Plugin GDExtension demo — a dockable editor panel written entirely in Rust using gdext's experimental-godot-api feature", "teaches": "Subclassing EditorPlugin and registering it with #class(tool). Using enter_tree / exit_tree to add/remove an editor dock panel. Building a simple VBoxContainer panel with a Label and Button child. Connecting a button's pressed signal to a Rust #func handler. Pure helper functions tested without needing the Godot runtime.", "controls": "", "path": "tech-demos/godot/editor-plugin", "tests": 5}, {"name": "event-bus", "engine": "godot", "summary": "Event Bus demo — Godot 4.3 + gdext 0.5", "teaches": "an autoloaded signal hub, so publishers and subscribers never hold direct references to each other.", "controls": "", "path": "tech-demos/godot/event-bus", "tests": 6}, {"name": "exported-properties", "engine": "godot", "summary": "Exported Properties GDExtension demo — showcasing the full range of #export field types visible in the Godot 4 inspector", "teaches": "exporting f64, i64, bool, GString, Color, and Vector2 fields; the distinction between exported (inspector-visible) and private (internal) fields; and periodic logic driven by process().", "controls": "", "path": "tech-demos/godot/exported-properties", "tests": 7}, {"name": "game-clock", "engine": "godot", "summary": "In-game day/night clock demo — Godot 4.3 + gdext 0.5", "teaches": "Tracking fractional in-game hours with a configurable speed multiplier. Pure functions for display formatting, sunrise/sunset detection, and computing a sky colour from the hour. Driving a ColorRect background and a Label HUD from a single clock resource with no GDScript.", "controls": "+ / – — speed up / slow down;  SPACE — pause.", "path": "tech-demos/godot/game-clock", "tests": 12}, {"name": "gdscript-interop", "engine": "godot", "summary": "GDScript Interop demo — calling GDScript methods from Rust via call(), and exposing Rust #func methods to GDScript. Demonstrates Variant conversion in both directions", "teaches": "calling GDScript from Rust with call(), exposing Rust to GDScript with #func, and converting values through Variant.", "controls": "", "path": "tech-demos/godot/gdscript-interop", "tests": 12}, {"name": "grid-movement", "engine": "godot", "summary": "grid-movement: Demonstrates tile-based movement with a queue of pending directions and smooth lerp toward the target cell position", "teaches": "queueing direction input in a VecDeque and lerping between grid cells so movement snaps without feeling instant.", "controls": "", "path": "tech-demos/godot/grid-movement", "tests": 9}, {"name": "groups", "engine": "godot", "summary": "Groups GDExtension demo — demonstrates Godot node groups from Rust", "teaches": "adding nodes to groups, querying group membership, and calling methods across a whole group at once.", "controls": "", "path": "tech-demos/godot/groups", "tests": 13}, {"name": "hello-world", "engine": "godot", "summary": "Hello World GDExtension demo — the minimum viable Rust extension for Godot 4", "teaches": "extension library declaration, a single Node2D subclass, an #export field visible in the Godot inspector, the ready() lifecycle hook, and how to reach a child node from Rust.", "controls": "", "path": "tech-demos/godot/hello-world", "tests": 7}, {"name": "hex-grid", "engine": "godot", "summary": "Hexagonal grid demo — Godot 4.3 + gdext 0.5", "teaches": "Axial (q, r) hex coordinates and their conversion to pixel space. Drawing flat-top hexagons using draw_polygon in _draw(). Highlighting a selected cell and its 6 neighbours by colour. Detecting which hex was clicked with pixel_to_axial + rounding.", "controls": "left-click — select hex;  R — reset.", "path": "tech-demos/godot/hex-grid", "tests": 8}, {"name": "hitbox-hurtbox", "engine": "godot", "summary": "Hitbox / hurtbox combat demo — Godot 4.3 + gdext 0.5", "teaches": "Separating the attack hitbox from the character body using Area2D. Detecting overlaps between a melee hitbox and enemy hurtboxes from Rust. Applying damage with a critical-hit multiplier via a pure function. Applying knockback to the victim's velocity as a pure function. The area_entered signal wired from Rust in ready().", "controls": "WASD — move player;  SPACE — swing attack.", "path": "tech-demos/godot/hitbox-hurtbox", "tests": 11}, {"name": "http-request", "engine": "godot", "summary": "HTTP Request GDExtension demo — drives Godot's built-in HttpRequest node from Rust, connecting the request_completed signal and parsing the response", "teaches": "Fetching an HttpRequest child via get_node_as in ready(). Connecting the request_completed signal to a Rust #func method. Sending a GET request with http.request(url). Converting PackedByteArray body bytes to a UTF-8 String. Tracking in-flight state to avoid concurrent requests. Pure response-parsing helpers fully covered by unit tests.", "controls": "", "path": "tech-demos/godot/http-request", "tests": 17}, {"name": "input-actions", "engine": "godot", "summary": "input-actions: Demonstrates polling Godot's Input singleton for action state from Rust. Shows held vs. just-pressed distinction for any configurable action", "teaches": "polling the Input singleton, and when is_action_pressed differs from is_action_just_pressed.", "controls": "", "path": "tech-demos/godot/input-actions", "tests": 9}, {"name": "inventory-system", "engine": "godot", "summary": "Inventory System demo — Godot 4.3 + gdext 0.5", "teaches": "a Vec&lt;Item&gt; inventory with slot capacity, and add / remove / query operations kept in plain Rust.", "controls": "", "path": "tech-demos/godot/inventory-system", "tests": 8}, {"name": "joints-2d", "engine": "godot", "summary": "Joints 2D GDExtension demo — connect physics bodies with PinJoint2D and DampedSpringJoint2D entirely from Rust", "teaches": "Spawning RigidBody2D nodes with CollisionShape2D children at runtime. Creating a PinJoint2D and connecting two bodies via set_node_a/set_node_b. Creating a DampedSpringJoint2D with configurable stiffness and damping. Getting node paths after add_child via body.get_path(). Displaying joint count on a Label child.", "controls": "", "path": "tech-demos/godot/joints-2d", "tests": 8}, {"name": "lighting-2d", "engine": "godot", "summary": "Lighting 2D GDExtension demo — drives PointLight2D energy, color, and texture_scale from Rust with a pulsing sine-wave effect each frame", "teaches": "Fetching a PointLight2D child via get_node_as in ready(). Animating light energy each frame using a sine-wave accumulator. Lerping colors between warm orange and cool blue based on elapsed time. Exposing toggle / color controls via #func for GDScript callers. Pure math helpers (pulse_energy, lerp_color, energy_to_label) that are covered by unit tests without needing the Godot runtime.", "controls": "", "path": "tech-demos/godot/lighting-2d", "tests": 11}, {"name": "line-drawing", "engine": "godot", "summary": "Line Drawing demo — captures mouse left-click positions and draws a colour-cycling polyline using Node2D's _draw() hook", "teaches": "procedural polyline drawing in _draw(), plus undo and clear over the stored point list.", "controls": "", "path": "tech-demos/godot/line-drawing", "tests": 10}, {"name": "line-trail", "engine": "godot", "summary": "Motion-trail demo — Godot 4.3 + gdext 0.5", "teaches": "Managing a Line2D node's point buffer from Rust to create a smooth trail. Trimming the trail to a maximum length by removing the oldest point. Computing per-point alpha fade with trail_alpha so older segments fade out. Using PackedVector2Array and PackedColorArray to batch-update a Line2D.", "controls": "WASD — move player.", "path": "tech-demos/godot/line-trail", "tests": 9}, {"name": "menu-with-options", "engine": "godot", "summary": "Menu With Options GDExtension demo — a settings menu with live config from Rust", "teaches": "Subclassing Control and populating an OptionButton in ready(). Connecting a Button's pressed signal to a Rust #func handler. Reading OptionButton, CheckBox, and HSlider values in on_apply. Storing the combined settings in a plain Rust struct (MenuConfig). Exposing get_difficulty() and get_volume() as Godot callables. Pure helpers (difficulty_name, volume_to_db, validate_volume) fully covered by unit tests.", "controls": "", "path": "tech-demos/godot/menu-with-options", "tests": 10}, {"name": "minimap", "engine": "godot", "summary": "Minimap demo — Godot 4.3 + gdext 0.5", "teaches": "Using _draw() via INode2D::draw to render a minimap purely from Rust. Converting world coordinates to minimap pixel coordinates with a pure function. Calling queue_redraw() each frame so the minimap stays in sync. Spawning enemies at fixed world positions and tracking them in a Vec.", "controls": "WASD — move player;  minimap updates automatically.", "path": "tech-demos/godot/minimap", "tests": 9}, {"name": "music-with-transitions", "engine": "godot", "summary": "Music With Transitions GDExtension demo — crossfade between music tracks from Rust", "teaches": "Holding two AudioStreamPlayer children (PlayerA and PlayerB) for smooth crossfading between music tracks. crossfade_to(path) loads a new stream on the inactive player, starts it at −80 dB, and begins a timed fade. Each process() tick advances fade_progress; volumes are lerped so the outgoing track fades out while the incoming track fades in. When the fade completes, the old player is stopped. Pure math helpers (crossfade_volumes, lerp_db) fully covered by tests.", "controls": "", "path": "tech-demos/godot/music-with-transitions", "tests": 8}, {"name": "navigation", "engine": "godot", "summary": "Navigation GDExtension demo — NavigationAgent2D path-following from Rust", "teaches": "Subclassing CharacterBody2D and fetching a child NavigationAgent2D via get_node_as in ready(). Setting a target position each frame from mouse coordinates. Querying get_next_path_position() and moving toward it. Updating a Label child with \"Navigating\" / \"Arrived\" status. Pure movement helpers (move_toward, arrived) fully covered by tests.", "controls": "", "path": "tech-demos/godot/navigation", "tests": 9}, {"name": "node-lifecycle", "engine": "godot", "summary": "Node Lifecycle demo — _enter_tree, _ready, _exit_tree ordering and NodeNotification constants observed from Rust", "teaches": "the ordering of _enter_tree, _ready, and _exit_tree, and how to handle NodeNotification.", "controls": "", "path": "tech-demos/godot/node-lifecycle", "tests": 13}, {"name": "noise-generation", "engine": "godot", "summary": "Noise Generation GDExtension demo — procedural terrain using FastNoiseLite from Rust", "teaches": "Creating a FastNoiseLite instance via FastNoiseLite::new_gd(). Querying a 2-D grid of noise values and caching them in a Vec&lt;Vec&lt;f32&gt;&gt;. Implementing _draw() to render filled rectangles colour-mapped from noise. Exporting configurable fields (cell_size, noise_scale) visible in the editor. A regenerate() func that re-seeds the noise and triggers a redraw. Pure terrain-classification helpers with full unit-test coverage.", "controls": "", "path": "tech-demos/godot/noise-generation", "tests": 13}, {"name": "object-pool", "engine": "godot", "summary": "Object Pool demo — pre-spawned nodes recycled via visibility and ProcessMode instead of repeated spawn/free cycles", "teaches": "pre-allocating a fixed pool of Sprite2D child nodes in ready(); tracking active/inactive state through is_visible(); moving active nodes each frame with a parallel velocity vector; deactivating out-of-bounds nodes; and resetting the entire pool in one call.", "controls": "", "path": "tech-demos/godot/object-pool", "tests": 14}, {"name": "one-shot-collision", "engine": "godot", "summary": "one-shot-collision: Demonstrates move_and_collide with KinematicCollision2D inspection in Rust. The body bounces around the screen, reflecting off surfaces", "teaches": "move_and_collide and reading the resulting KinematicCollision2D to bounce off a surface.", "controls": "", "path": "tech-demos/godot/one-shot-collision", "tests": 7}, {"name": "parallax-background", "engine": "godot", "summary": "Parallax Background GDExtension demo — multiple ParallaxLayer nodes driven by a Camera2D position updated from Rust, giving a depth-layered scrolling effect at different speeds", "teaches": "Controlling a Camera2D position from Rust each frame. How ParallaxBackground auto-scrolls its ParallaxLayer children when the camera moves (no manual offset calculation needed at runtime). Configuring motion_scale on ParallaxLayer children in ready(). Exposing reset_scroll and set_scroll_speed as #func methods. Pure helper functions for parallax math covered by unit tests.", "controls": "", "path": "tech-demos/godot/parallax-background", "tests": 9}, {"name": "particles-2d", "engine": "godot", "summary": "Particles 2D demo — CPUParticles2D emission control driven from Rust", "teaches": "finding a CpuParticles2D child with get_node_as; configuring emission amount, lifetime, direction, and spread from Rust; toggling emission on/off; and scheduling a one-shot burst via a Timer child.", "controls": "", "path": "tech-demos/godot/particles-2d", "tests": 9}, {"name": "pathfinding-astar", "engine": "godot", "summary": "Pathfinding A* GDExtension demo — interactive grid path-finding from Rust", "teaches": "Creating an AStar2D instance via AStar2D::new_gd(). Adding grid points and connecting orthogonal neighbours. Left-click to set start, right-click to set goal, then querying the path. Implementing _draw() to colour-code cells (empty / start / goal / path) and draw a polyline along the found path. Pure helpers (grid_to_id, id_to_grid, grid_to_world, manhattan) fully covered by unit tests.", "controls": "", "path": "tech-demos/godot/pathfinding-astar", "tests": 14}, {"name": "player-movement", "engine": "godot", "summary": "Player Movement GDExtension demo — CharacterBody2D with WASD/arrow-key movement, gravity, and jumping", "teaches": "physics_process, get_velocity/set_velocity, move_and_slide, is_on_floor, exported tunable properties, and extracting pure functions for testability.", "controls": "", "path": "tech-demos/godot/player-movement", "tests": 17}, {"name": "quest-system", "engine": "godot", "summary": "Quest System demo — Godot 4.3 + gdext 0.5", "teaches": "a quest log driven by a QuestStatus enum, with objective progress and automatic completion.", "controls": "", "path": "tech-demos/godot/quest-system", "tests": 8}, {"name": "ray-casting", "engine": "godot", "summary": "ray-casting: Demonstrates Godot 2D physics ray-casting from Rust. Draws a line from the node origin toward the mouse cursor, stopping at the first physics body hit", "teaches": "querying PhysicsDirectSpaceState2D for a ray hit and reading back the collision point and surface normal.", "controls": "", "path": "tech-demos/godot/ray-casting", "tests": 6}, {"name": "rich-text-label", "engine": "godot", "summary": "Rich Text Label demo — BBCode-style formatted text driven from Rust using the RichTextLabel push/pop API", "teaches": "accessing a child node with get_node_as, calling push_color, push_bold, append_text, pop, newline, and clear on a RichTextLabel child; extracting pure text-processing helpers that are fully unit-testable without Godot.", "controls": "", "path": "tech-demos/godot/rich-text-label", "tests": 16}, {"name": "rigid-body-2d", "engine": "godot", "summary": "Rigid Body 2D GDExtension demo — impulse-based physics movement from Rust", "teaches": "Subclassing RigidBody2D and implementing IRigidBody2D::physics_process. Reading Input::singleton() for WASD directional input each physics frame. Applying forces via apply_central_impulse — the engine owns the velocity. Clamping velocity magnitude to enforce a max speed. Displaying the current speed on a Label child node. Exposing a apply_explosion_impulse func for external triggering.", "controls": "", "path": "tech-demos/godot/rigid-body-2d", "tests": 14}, {"name": "save-and-load", "engine": "godot", "summary": "Save and Load demo — Godot 4.3 + gdext 0.5", "teaches": "hand-rolled JSON serialization written to user:// through Godot's FileAccess, with no external crate dependency.", "controls": "", "path": "tech-demos/godot/save-and-load", "tests": 7}, {"name": "scene-instancing", "engine": "godot", "summary": "Scene Instancing GDExtension demo — load a .tscn at runtime and instantiate it from Rust using ResourceLoader and PackedScene", "teaches": "Using ResourceLoader::singleton() to load a resource by path. Casting Gd&lt;Resource&gt; to Gd&lt;PackedScene&gt; with try_cast. Calling PackedScene::instantiate() to get a live node. Adding the instance as a child of the scene root. Clearing all instances with queue_free. Enforcing a maximum instance count.", "controls": "", "path": "tech-demos/godot/scene-instancing", "tests": 9}, {"name": "scene-manager", "engine": "godot", "summary": "Scene Manager demo — Godot 4.3 + gdext 0.5", "teaches": "an autoload that swaps scenes with change_scene_to_file while keeping a breadcrumb of where the player has been.", "controls": "", "path": "tech-demos/godot/scene-manager", "tests": 7}, {"name": "scene-tree", "engine": "godot", "summary": "Scene Tree GDExtension demo — navigating the Godot scene tree from Rust", "teaches": "getting a child by name with get_node_as, iterating all children with get_children, reading child names via Gd&lt;T&gt; smart pointers, and checking child count with get_child_count.  TreeExplorer logs every child's name on ready and exposes helpers that GDScript can call at runtime to inspect the tree programmatically.", "controls": "", "path": "tech-demos/godot/scene-tree", "tests": 14}, {"name": "screen-effects", "engine": "godot", "summary": "Camera shake and color flash screen-effects demo — Godot 4.3 + gdext 0.5", "teaches": "Driving camera shake from Rust using trauma → shake magnitude. Computing a per-frame shake offset from a trauma value and deterministic angle. Lerping a color flash overlay back to transparent from Rust. Wiring input to trigger both effects without GDScript.", "controls": "SPACE — camera shake;  F — color flash;  ESC — quit.", "path": "tech-demos/godot/screen-effects", "tests": 12}, {"name": "shader-params", "engine": "godot", "summary": "Shader Params demo — drives a ShaderMaterial's uniform parameters from Rust, animating a time value each frame", "teaches": "setting ShaderMaterial uniforms from Rust at runtime to drive a shader from gameplay state.", "controls": "", "path": "tech-demos/godot/shader-params", "tests": 7}, {"name": "signals", "engine": "godot", "summary": "Signals GDExtension demo — Rust-defined #signal declarations, typed emit_signal calls, and connecting signals between nodes in ready()", "teaches": "#signal declaration syntax, emit_signal with variant arguments, connect for wiring nodes together, and the node-tree relationship between a parent scene node and a reusable component child.", "controls": "", "path": "tech-demos/godot/signals", "tests": 17}, {"name": "singleton-autoload", "engine": "godot", "summary": "Singleton Autoload demo — Godot 4.3 + gdext 0.5", "teaches": "registering a Rust node as an autoloaded global service, and reading it from an unrelated consumer node.", "controls": "", "path": "tech-demos/godot/singleton-autoload", "tests": 6}, {"name": "spawner", "engine": "godot", "summary": "Spawner GDExtension demo — demonstrates dynamic node creation from Rust", "teaches": "instantiating nodes at runtime from Rust and giving each one its own per-instance state.", "controls": "", "path": "tech-demos/godot/spawner", "tests": 14}, {"name": "split-screen", "engine": "godot", "summary": "Split-screen demo — Godot 4.3 + gdext 0.5", "teaches": "Creating two SubViewport + SubViewportContainer pairs entirely from Rust. Each viewport has its own Camera2D that independently follows a player. Pure functions for camera smoothing and screen-rect computation. A shared world Node2D holds the player nodes so both cameras see them.", "controls": "", "path": "tech-demos/godot/split-screen", "tests": 8}, {"name": "state-machine", "engine": "godot", "summary": "State Machine demo — Godot 4.3 + gdext 0.5", "teaches": "a stateless transition function driving a finite state machine, so the transition rules are unit-testable without an engine.", "controls": "", "path": "tech-demos/godot/state-machine", "tests": 10}, {"name": "steering-behaviors", "engine": "godot", "summary": "Steering Behaviors GDExtension demo — autonomous movement AI from Rust", "teaches": "Seek, Flee, and Wander as pure vector math applied to a CharacterBody2D.", "controls": "", "path": "tech-demos/godot/steering-behaviors", "tests": 10}, {"name": "tilemap-basic", "engine": "godot", "summary": "Tilemap Basic GDExtension demo — reading and writing TileMap cells from Rust", "teaches": "Storing tile data in a Vec&lt;u8&gt; in Rust (0=empty, 1=floor, 2=wall). Generating a simple bordered room procedurally: walls on edges, floors inside. Looking up a TileMap child with try_get_node_as and calling set_cell. Exposing get_tile_at and set_tile_at funcs for GDScript interaction. Displaying tile count on a Label child.", "controls": "", "path": "tech-demos/godot/tilemap-basic", "tests": 16}, {"name": "tilemap-procedural", "engine": "godot", "summary": "Tilemap Procedural demo — fills a TileMap from Rust using a cellular-automata cave generator. Demonstrates how to drive Godot's TileMap API entirely from Rust code, including per-cell writes and multi-step smoothing", "teaches": "a cellular-automata cave generator written cell by cell into a TileMap.", "controls": "", "path": "tech-demos/godot/tilemap-procedural", "tests": 12}, {"name": "timer-and-countdown", "engine": "godot", "summary": "Timer and Countdown demo — creates a repeating Timer child, tracks ticks, and shows a live countdown to the next tick on a Label", "teaches": "driving a Timer node from Rust and rendering its remaining time to a HUD label.", "controls": "", "path": "tech-demos/godot/timer-and-countdown", "tests": 7}, {"name": "tooltip-system", "engine": "godot", "summary": "Tooltip System demo — shows a PanelContainer with tooltip text on mouse enter and hides it on mouse exit", "teaches": "showing and hiding a PanelContainer tooltip from hover signals wired up in Rust.", "controls": "", "path": "tech-demos/godot/tooltip-system", "tests": 8}, {"name": "tweening", "engine": "godot", "summary": "Tweening demo — animates a node's position and modulate color using Godot Tweens", "teaches": "creating and sequencing a Tween entirely from Rust, including chained and parallel steps.", "controls": "", "path": "tech-demos/godot/tweening", "tests": 10}, {"name": "ui-health-bar", "engine": "godot", "summary": "UI Health Bar demo — drives a ProgressBar and Label from Rust, exposing damage() and heal() functions that clamp health to 0, max_health", "teaches": "wiring a ProgressBar and Label to a health value owned by Rust.", "controls": "", "path": "tech-demos/godot/ui-health-bar", "tests": 10}, {"name": "virtual-joystick", "engine": "godot", "summary": "virtual-joystick: An on-screen joystick Control drawn entirely in Rust. Reports a clamped unit-vector axis value that other nodes can read", "teaches": "an on-screen joystick drawn with draw_arc / draw_circle, including a dead zone so a resting thumb reads as no input.", "controls": "", "path": "tech-demos/godot/virtual-joystick", "tests": 7}, {"name": "astar-pathfinding", "engine": "brackets", "summary": "A* pathfinding demo — click anywhere and walk there through a random cave", "teaches": "implementing bracket-lib's BaseMap and Algorithm2D traits so a_star_search and field_of_view_set can navigate your own map type, previewing a path under the mouse, and walking it one step per frame.", "controls": "move the mouse to preview a path; left-click to walk it.", "path": "tech-demos/brackets/astar-pathfinding", "tests": 13}, {"name": "mouse-control", "engine": "brackets", "summary": "Mouse control demo — reading mouse position and buttons in bracket-terminal", "teaches": "polling the global INPUT lock for the mouse tile and button states, drawing a cursor at the mouse position with DrawBatch, and rendering a batch through render_draw_buffer.", "controls": "move the mouse; hold left (red) or right (blue) button.", "path": "tech-demos/brackets/mouse-control", "tests": 5}];
const REPO = "https://github.com/matthewscottconroy/tiny-rust-games/tree/main/";
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const q = document.getElementById("q");
let engine = "all";

function render() {
  const needle = q.value.trim().toLowerCase();
  const shown = DEMOS.filter(d =>
    (engine === "all" || d.engine === engine) &&
    (!needle || (d.name + " " + d.summary + " " + d.teaches).toLowerCase().includes(needle)));

  count.textContent = shown.length + " of " + DEMOS.length + " demos";
  grid.innerHTML = shown.length ? shown.map(d => `
    <article>
      <span class="tag ${d.engine}">${d.engine}</span>
      <h2><a href="${REPO}${d.path}">${d.name}</a></h2>
      <p class="summary">${d.summary}</p>
      ${d.teaches ? `<p class="teaches">${d.teaches}</p>` : ""}
      <p class="meta">${d.tests} test${d.tests === 1 ? "" : "s"}${d.controls ? " · " + d.controls : ""}</p>
    </article>`).join("") : `<p class="empty">Nothing matches “${needle}”.</p>`;
}

q.addEventListener("input", render);
document.querySelectorAll("button[data-engine]").forEach(b =>
  b.addEventListener("click", () => {
    engine = b.dataset.engine;
    document.querySelectorAll("button[data-engine]").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
    render();
  }));
render();
</script>
</body>
</html>
