[package]
name = "snake-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/matthewscottconroy/tiny-rust-games"
description = "Engine-agnostic Snake rules, with a Ticker that turns frame time into simulation steps"

[dependencies]

