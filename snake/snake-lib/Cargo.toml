[package]
name = "snake-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/matthewscottconroy/tiny-rust-games"
keywords = ["game", "snake", "gamedev", "no-std", "engine-agnostic"]
categories = ["game-development", "games"]
readme = "README.md"
description = "Engine-agnostic Snake rules, with a Ticker that turns frame time into simulation steps"

[dependencies]

# Public items must carry `///` docs; CI runs clippy with `-D warnings`.
[lints.rust]
missing_docs = "warn"

[dev-dependencies]
proptest = "1"
