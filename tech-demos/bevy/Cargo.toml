# Cargo workspace for all Bevy tech demos.
#
# A single virtual workspace means every demo shares one `target/` directory and
# one `Cargo.lock`, so Bevy and its dependencies are compiled once and reused
# across all demos instead of rebuilt per crate. Build any demo with
# `cargo run -p <demo-name>` from this directory, or `cargo run` from inside it.
[workspace]
resolver = "2"
members = [
    "_template",
    "ability-cooldowns",
    "achievement-system",
    "ascii-npc-sim",
    "audio",
    "behavior-tree",
    "boids-flocking",
    "bullet-pattern",
    "camera-follow",
    "card-game",
    "circle-buttons",
    "collision-detection",
    "combo-system",
    "crafting-system",
    "custom-shader",
    "cutscene-sequencer",
    "day-night-cycle",
    "destructible-terrain",
    "dialog-system",
    "drag-and-drop",
    "draw-window",
    "ecs-ascii-sim",
    "enemy-chase-ai",
    "events",
    "fixed-timestep",
    "floating-text",
    "flow-field-pathfinding",
    "fog-of-war",
    "gamepad-input",
    "grid-movement",
    "health-and-damage",
    "hello-plugin",
    "hello-world",
    "hex-grid",
    "hud-and-ui",
    "inventory-ui",
    "knockback-hitstop",
    "lighting-2d",
    "line-of-sight",
    "loot-table",
    "menu-navigation",
    "minimap",
    "mouse-input",
    "movable-sprite",
    "noise-map",
    "notification-system",
    "object-pooling",
    "observer-events",
    "one-shot-systems",
    "parallax-background",
    "particle-system",
    "pathfinding",
    "pickup-and-inventory",
    "pixel-perfect-camera",
    "platformer-physics",
    "procedural-dungeon",
    "projectiles",
    "rabbit_carrot_wolf",
    "required-components",
    "rope-simulation",
    "rubber-band-selection",
    "save-load",
    "scene-pause",
    "scene-transition",
    "screen-shake",
    "screen-wrap",
    "soft-body",
    "spatial-partitioning",
    "sprite-demo",
    "spritesheet-animation",
    "state-machine-ai",
    "status-effects",
    "stealth-ai",
    "tilemap",
    "time-scale",
    "turn-based",
    "tween-animation",
    "two-players",
    "upgrade-tree",
    "water-ripple",
    "wave-spawner",
    "weather-system",
    "y-sort",
]

# Central version pin so every demo tracks the same Bevy release. Each member
# depends on it with `bevy.workspace = true`.
[workspace.dependencies]
bevy = "0.18"

# Bevy's recommended development profile: compile the demo's own code with light
# optimization for fast incremental rebuilds, but compile all dependencies
# (Bevy included) fully optimized so the demos run at a playable frame rate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
