name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting is a pure syntax check, so it needs neither system libraries nor
  # a compiled dependency tree — it runs in seconds and fails fast for everyone.
  # Deliberately hand-aligned data tables opt out with `#[rustfmt::skip]`.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting of every crate
        run: |
          set -uo pipefail
          failed=""
          for manifest in \
            tech-demos/bevy/Cargo.toml \
            tech-demos/godot/*/Cargo.toml \
            tech-demos/brackets/*/Cargo.toml \
            tic-tac-toe/*/Cargo.toml \
            snake/snake-lib/Cargo.toml \
            snake/snake-godot/Cargo.toml \
            snake/snake-lockstep/Cargo.toml \
            breakout/breakout-lib/Cargo.toml \
            breakout/breakout-godot/Cargo.toml; do
            if ! cargo fmt --manifest-path "$manifest" --all --check; then
              failed="$failed $manifest"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Unformatted crates:$failed"
            echo "Run 'cargo fmt --manifest-path <manifest> --all' to fix."
            exit 1
          fi

  # The Bevy demos share one Cargo workspace, so Bevy compiles once and every
  # demo (plus its unit tests) is built, linted, and tested in a single
  # invocation. tic-tac-toe-bevy lives under tic-tac-toe/ but is a member of
  # this workspace, so it is covered here rather than in the `misc` job — that
  # keeps Bevy from being compiled a second time.
  bevy:
    name: Bevy demos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # ALSA and udev back bevy_audio and gamepad input; wayland and xkbcommon
      # are pulled in unconditionally by winit. GitHub's runner image happens to
      # ship the latter two, but naming them keeps this job reproducible on any
      # runner and documents the real dependency set. macOS and Windows need
      # none of this — the frameworks ship with the OS.
      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tech-demos/bevy
          key: ${{ matrix.os }}

      - name: Clippy all demos
        run: >
          cargo clippy --locked --workspace --all-targets
          --manifest-path tech-demos/bevy/Cargo.toml -- -D warnings

      - name: Test all demos
        run: cargo test --locked --workspace --manifest-path tech-demos/bevy/Cargo.toml

  # The Godot demos are intentionally standalone crates (each keeps its own
  # target/ so the .gdextension can resolve res://target/debug/*.so), so they
  # are linted and tested in a loop. gdext bundles the Godot API, so no Godot
  # install is required to compile or test. tic-tac-toe-godot rides along here
  # so it reuses the one gdext build rather than triggering another.
  godot:
    name: Godot demos (per-crate)
    runs-on: ubuntu-latest
    env:
      # Share one target dir across all crates so gdext compiles once per
      # pinned version instead of 67 times. This only affects CI compilation;
      # the per-crate target/ layout that .gdextension files rely on matters
      # only when running the demos inside Godot itself.
      #
      # Kept inside tech-demos/godot because rust-cache resolves a workspace's
      # target directory relative to the workspace root — an absolute path here
      # would not match what it caches.
      CARGO_TARGET_DIR: ${{ github.workspace }}/tech-demos/godot/.shared-target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rust-cache caches a workspace's target directory, so it has to be told
      # about the shared one above — otherwise it caches an empty ./target and
      # every run recompiles gdext from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tech-demos/godot -> .shared-target

      - name: Lint and test every Godot demo
        run: |
          set -uo pipefail
          failed=""
          for manifest in tech-demos/godot/*/Cargo.toml \
                          tic-tac-toe/tic-tac-toe-godot/Cargo.toml \
                          snake/snake-godot/Cargo.toml \
                          breakout/breakout-godot/Cargo.toml; do
            demo=$(basename "$(dirname "$manifest")")
            echo "::group::$demo"
            if ! cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings; then
              failed="$failed $demo(clippy)"
            elif ! cargo test --locked --manifest-path "$manifest"; then
              failed="$failed $demo(test)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed Godot demos:$failed"
            exit 1
          fi

  # The remaining standalone crates. Deliberately NOT a glob over
  # tic-tac-toe/*: the Bevy and Godot frontends are covered by the jobs above,
  # and matching them here would compile Bevy and gdext all over again.
  misc:
    name: Other crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint and test standalone crates
        env:
          # bracket-lib pulls in expat-sys, whose bundled CMake project declares
          # a minimum below what CMake >= 4.0 accepts.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -uo pipefail
          failed=""
          for manifest in \
            tic-tac-toe/tic-tac-toe-lib/Cargo.toml \
            tic-tac-toe/tic-tac-toe-cli/Cargo.toml \
            tic-tac-toe/tic-tac-toe-brackets/Cargo.toml \
            snake/snake-lib/Cargo.toml \
            snake/snake-lockstep/Cargo.toml \
            breakout/breakout-lib/Cargo.toml \
            tech-demos/brackets/*/Cargo.toml; do
            echo "::group::$manifest"
            if ! cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings; then
              failed="$failed $manifest(clippy)"
            elif ! cargo test --locked --manifest-path "$manifest"; then
              failed="$failed $manifest(test)"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed crates:$failed"
            exit 1
          fi

  # The three rules crates promise reproducibility: the same inputs give the
  # same game, which is what makes replays and lockstep possible. Every test
  # asserting that runs on one machine, where it is nearly free. This job asks
  # the harder question — do Linux, macOS and Windows agree? — because Breakout
  # is f32 throughout, and floating point is allowed to differ between targets.
  #
  # The rules crates have no dependencies at all, so this stays cheap: no system
  # libraries, no engine, a few seconds of compiling per platform.
  determinism:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the rules crates
        shell: bash
        run: |
          set -euo pipefail
          for manifest in snake/snake-lib/Cargo.toml breakout/breakout-lib/Cargo.toml; do
            echo "::group::$manifest"
            cargo test --locked --manifest-path "$manifest"
            echo "::endgroup::"
          done

      - name: Record state digests
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo run --locked --quiet --manifest-path snake/snake-lib/Cargo.toml \
              --example state-hash
            cargo run --locked --quiet --manifest-path breakout/breakout-lib/Cargo.toml \
              --example state-hash
          } | tee full-${{ matrix.os }}.txt
          # Keep only the digest lines; the rest is context for a human reading
          # the log, and would differ harmlessly in formatting.
          grep -E '^(snake|breakout) ' "full-${{ matrix.os }}.txt" > "digest-${{ matrix.os }}.txt"
          cat "digest-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt

  # Compares what the three platforms produced. Kept as a separate job so the
  # failure message can show all three digests at once, which is the only form
  # in which a mismatch is actually informative.
  determinism-compare:
    name: Determinism agrees across platforms
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: false

      - name: Compare digests
        run: |
          set -euo pipefail
          echo "Digests reported by each platform:"
          for dir in digest-*; do
            echo "--- $dir"
            cat "$dir"/*.txt
          done

          failed=""
          for game in snake breakout; do
            # One line per platform for this game, deduplicated.
            distinct=$(grep -h "^$game " digest-*/*.txt | sort -u | wc -l)
            if [ "$distinct" -ne 1 ]; then
              failed="$failed $game"
            fi
          done

          if [ -n "$failed" ]; then
            echo
            echo "Platforms disagree for:$failed"
            echo
            echo "This is a real result, not necessarily a bug to paper over."
            echo "Snake is integer-only and must agree everywhere; if it does"
            echo "not, the rules depend on something they should not."
            echo "Breakout is f32, where cross-target differences are allowed."
            echo "If Breakout is the one that differs, the honest fix is to"
            echo "document that its replays are portable only within a target,"
            echo "not to force the digests to match."
            exit 1
          fi
          echo
          echo "All platforms agree."

  # The games are playable in a browser, which only works because their rules
  # crates have no engine dependency. This job keeps that true: a change that
  # quietly makes a game unbuildable for wasm fails here rather than at deploy.
  wasm:
    name: Games build for the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tech-demos/bevy
          key: wasm

      - name: Build the games for wasm32
        run: >
          cargo build --locked --target wasm32-unknown-unknown
          --manifest-path tech-demos/bevy/Cargo.toml
          -p snake-bevy -p tic-tac-toe-bevy -p breakout-bevy

  # The catalogue is generated from each demo's own module docs. Regenerating
  # and diffing catches a demo added without refreshing it, which is the only
  # way the page can go stale.
  catalogue:
    name: Generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/catalogue.py --check
      - run: python3 tools/parity.py --check
      - run: python3 tools/learning-path.py --check

  # CI compiled the Godot demos but never loaded one, which left a whole class
  # of breakage invisible: a .gdextension naming a library that does not exist,
  # a scene referencing a class the Rust side never registers. Both compile
  # perfectly and fail the moment anyone opens the project.
  #
  # Godot reports those as errors and then carries on with a placeholder node,
  # exiting 0 — so tools/validate-godot.sh inspects the log rather than trusting
  # the exit code.
  godot-loads:
    name: Godot projects load their Rust classes
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tech-demos/godot/.shared-target
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tech-demos/godot -> .shared-target
          key: godot-loads

      - name: Install Godot
        run: |
          url="https://github.com/godotengine/godot/releases/download"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSL -o godot.zip "$url/${GODOT_VERSION}-stable/${file}.zip"
          unzip -q godot.zip
          sudo install -m 755 "$file" /usr/local/bin/godot
          godot --version

      # One shared target directory, so gdext compiles once rather than 70
      # times; the validator copies each artifact to the res://target/debug path
      # a .gdextension expects.
      - name: Build every Godot extension
        run: |
          set -uo pipefail
          for manifest in tech-demos/godot/*/Cargo.toml \
                          tic-tac-toe/tic-tac-toe-godot/Cargo.toml \
                          snake/snake-godot/Cargo.toml \
                          breakout/breakout-godot/Cargo.toml; do
            cargo build --locked --manifest-path "$manifest"
          done

      - name: Load every project headlessly
        run: tools/validate-godot.sh
